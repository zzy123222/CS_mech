[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mechanism-research"
version = "0.1.0"
description = "Causal profiling of evidence arbitration and error-conditioned verification in large language models."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
